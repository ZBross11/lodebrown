<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lo de Brown</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;700&display=swap">
<style>
  :root{
    --fondo:#181818;
    --panel:#222120;
    --texto:#f4f1ea;
    --texto-suave:#b8b2a6;
    --acento:#d9a441;
    --linea:#3c3a36;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--fondo);
    color:var(--texto);
    font-family:'Karla',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }
  .tarjeta{
    width:100%;
    max-width:420px;
    text-align:center;
    display:flex;
    flex-direction:column;
    gap:32px;
  }
  .marca{display:flex;flex-direction:column;gap:6px;align-items:center}
  .logo{width:min(260px,70vw);height:auto;display:block}
  .lema{
    margin:0;
    color:var(--texto-suave);
    font-size:.82rem;
    letter-spacing:.28em;
    text-transform:uppercase;
  }
  .separador{
    display:flex;align-items:center;gap:14px;
    color:var(--acento);
    font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;
  }
  .separador::before,.separador::after{
    content:"";flex:1;height:1px;background:var(--linea);
  }
  .opciones{display:flex;flex-direction:column;gap:14px}
  .opcion{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;
    background:var(--panel);
    border:1px solid var(--linea);
    border-radius:6px;
    padding:20px 22px;
    text-decoration:none;
    color:var(--texto);
    cursor:pointer;
    transition:border-color .18s ease, transform .18s ease;
  }
  .opcion:hover,.opcion:focus-visible{
    border-color:var(--acento);
    transform:translateY(-2px);
    outline:none;
  }
  .opcion:focus-visible{box-shadow:0 0 0 2px var(--acento)}
  .opcion[aria-busy="true"]{opacity:.6;pointer-events:none}
  .idioma{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
  .idioma strong{
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;
    font-size:1.35rem;
  }
  .idioma span{color:var(--texto-suave);font-size:.85rem}
  .flecha{color:var(--acento);font-size:1.2rem}
  .bandera{font-size:1.5rem}
  .pie{
    color:var(--texto-suave);
    font-size:.78rem;
    letter-spacing:.06em;
    line-height:1.7;
    margin:0;
  }
  .pie a{color:var(--acento);text-decoration:none}
  @media (prefers-reduced-motion: reduce){
    .opcion{transition:none}
    .opcion:hover{transform:none}
  }
</style>
</head>

<script>
// ====== Configuración ======
var API_KEY = 'AIzaSyD8nccqqaoHZO00SuMx75Hl8LxE1yUKABg';
var CARPETA_ES = '1kNCP58okuCTSCKdsTgM-zE6lOnnBtpGl'; // Carta Español
var CARPETA_EN = '1A3NlNSpSpCbg8oQ-3AmH-Ry6sIY2vnzP'; // Menu English
// ===========================

function abrirCarta(idCarpeta, boton, textoEspera, textoError) {
  var sub = boton.querySelector('[data-rol="sub"]');
  var original = sub.textContent;
  boton.setAttribute('aria-busy', 'true');
  sub.textContent = textoEspera;

  var q = encodeURIComponent("'" + idCarpeta + "' in parents and mimeType='application/pdf' and trashed=false");
  var url = 'https://www.googleapis.com/drive/v3/files?q=' + q +
            '&orderBy=modifiedTime%20desc&pageSize=1&fields=files(id)&key=' + API_KEY;

  fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.files && data.files.length > 0) {
        window.location.href = 'https://drive.google.com/file/d/' + data.files[0].id + '/view';
      } else {
        throw new Error('sin archivos');
      }
    })
    .catch(function () {
      // Plan B: si la API falla, abrimos la carpeta directamente.
      sub.textContent = textoError;
      boton.removeAttribute('aria-busy');
      setTimeout(function () { sub.textContent = original; }, 4000);
      window.location.href = 'https://drive.google.com/drive/folders/' + idCarpeta;
    });
}

document.getElementById('btn-es').addEventListener('click', function (e) {
  e.preventDefault();
  abrirCarta(CARPETA_ES, this, 'Abriendo…', 'Abriendo carpeta…');
});
document.getElementById('btn-en').addEventListener('click', function (e) {
  e.preventDefault();
  abrirCarta(CARPETA_EN, this, 'Opening…', 'Opening folder…');
});
</script>
